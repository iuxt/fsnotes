<!DOCTYPE html>
<html class="{FSNOTES_APPEARANCE}">

<head>
    <title>{TITLE}</title>
    <link rel="apple-touch-icon" sizes="180x180" href="{WEB_PATH}apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="{WEB_PATH}favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="{WEB_PATH}favicon-16x16.png">
    <meta name="keywords" content="FSNotes, Markdown, Sharing, Web, Hosting">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta charset="utf-8">
    <meta name="publisher" content="fsnot.es">
    <meta name="author" content="fsnot.es">
    <meta name="robots" content="index,follow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link charset="utf-8" href="{WEB_PATH}main.css?v=2.0.0" rel="stylesheet">
    
    {INLINE_CSS}
    {MATH_JAX_JS}
    
    <script charset="utf-8" src="{WEB_PATH}js/highlight.min.js" type="text/javascript"></script>
    
    <script>
        (function () {
            if (window.__scrollObserverInstalled) return;
            window.__scrollObserverInstalled = true;

            let ticking = false;

            function reportScroll() {
                if (ticking) return;
                ticking = true;

                requestAnimationFrame(() => {
                    const x = window.scrollX || document.documentElement.scrollLeft;
                    const y = window.scrollY || document.documentElement.scrollTop;

                    if ({FSNOTES_PREVIEW} && window.webkit && window.webkit.messageHandlers) {
                        window.webkit.messageHandlers.scrollPosition.postMessage({ x, y });
                    }
                    ticking = false;
                });
            }

            window.addEventListener('scroll', reportScroll, { passive: true });
        })();
        
        function getElementsByText(str, tag = 'h1') {
            return Array.prototype.slice.call(document.getElementsByTagName(tag)).filter(el => el.textContent.trim() === str.trim());
        }

        function getSelectionAndSendMessage() {
            var txt = document.getSelection().toString();
            if ({FSNOTES_PREVIEW}) {
                window.webkit.messageHandlers.newSelectionDetected.postMessage(txt);
            }
        }
        
        function getElementsByTextContent(elText) {
            var allSpans = document.querySelectorAll('h1, h2, h3, h4, h5, h6')
            for (var i = 0; i < allSpans.length; i++) {
                var spanText = allSpans[i].innerHTML;
                if(spanText == elText ){
                    return allSpans[i];
                }
            }
        }

        document.onmouseup = getSelectionAndSendMessage;
        document.onkeyup = getSelectionAndSendMessage;
        document.oncontextmenu = getSelectionAndSendMessage;
    </script>
    
    <script>
        let loadCodeActions = () => {
            document.querySelectorAll('pre > code:not(.language-mermaid)').forEach(code => {
                const pre = code.parentElement;
                const language = Array.from(code.classList).find(name => name.startsWith('language-'));
                const opening = document.createElement('span');
                opening.className = 'codeFence';
                opening.textContent = '```' + (language ? language.slice('language-'.length) : '');
                const closing = document.createElement('span');
                closing.className = 'codeFence';
                closing.textContent = '```';
                pre.insertBefore(opening, code);
                code.after(closing);
                const button = document.createElement('button');
                const copyIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg>';
                button.type = 'button';
                button.className = 'copyCode';
                button.title = 'Copy code';
                button.setAttribute('aria-label', 'Copy code');
                button.innerHTML = copyIcon;
                pre.classList.add('hasCopyButton');
                pre.appendChild(button);

                button.addEventListener("mouseenter", function() {
                    if ({FSNOTES_PREVIEW}) {
                        window.webkit.messageHandlers.mouse.postMessage('enter')
                    }
                });

                button.addEventListener("mouseleave", function() {
                    if ({FSNOTES_PREVIEW}) {
                        window.webkit.messageHandlers.mouse.postMessage('leave')
                    }
                });

                let feedbackTimeout;
                button.addEventListener("click", async function() {
                    clearTimeout(feedbackTimeout);
                    button.innerHTML = copyIcon;
                    button.disabled = true;
                    try {
                        if ({FSNOTES_PREVIEW}) {
                            window.webkit.messageHandlers.clipboard.postMessage(code.textContent);
                        } else {
                            await navigator.clipboard.writeText(code.textContent);
                        }

                        button.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>';
                        button.title = 'Copied';
                        button.setAttribute('aria-label', 'Copied');
                    } catch (error) {
                        button.title = 'Copy failed';
                        button.setAttribute('aria-label', 'Copy failed');
                        console.error('Failed to copy code:', error);
                    } finally {
                        button.disabled = false;
                        feedbackTimeout = setTimeout(() => {
                            button.innerHTML = copyIcon;
                            button.title = 'Copy code';
                            button.setAttribute('aria-label', 'Copy code');
                        }, 1500);
                    }
                });
            });
        }
        
        let loadAHover = () => {
            var aList = document.getElementsByTagName("a"),
                aLength = aList.length,
                j = 0;

            for (j; j < aLength; j++) {
                aList[j].addEventListener("mouseenter", function(event) {
                    if ({FSNOTES_PREVIEW}) {
                        window.webkit.messageHandlers.mouse.postMessage('enter')
                    }
                });

                aList[j].addEventListener("mouseleave", function(event) {
                    if ({FSNOTES_PREVIEW}) {
                        window.webkit.messageHandlers.mouse.postMessage('leave')
                    }
                });
            }
        }
        
        let loadListStyle = () => {
            var liList = document.getElementsByTagName("li"),
                length = liList.length,
                i = 0;

            for (i; i < length; i++) {
                if (liList[i].parentNode.tagName == "UL" && liList[i].parentNode.classList.contains('cb')) {
                    if (liList[i].querySelectorAll('input').length == 0) {
                        liList[i].style.listStyleType = "disc"
                    }
                }
            }
        }
        
        let loadCheckboxStyle = () => {
            var preList = document.getElementsByTagName("input"),
                length = preList.length,
                i = 0;

            for (i; i < length; i++) {
                preList[i].disabled = true;

                if (preList[i].parentNode.tagName == "P" && preList[i].parentNode.parentNode.tagName == "LI") {
                    preList[i].parentNode.parentNode.parentNode.classList.add('cb')
                    continue;
                }

                if (preList[i].parentNode.tagName != "LI") {
                    continue;
                }

                preList[i].parentNode.parentNode.classList.add('cb')
            }
        }
        
        let addCheckboxEvent = (element) => {
            if (element.parentNode.nodeName == 'LI') {
                element.parentNode.classList.remove('strike');
            }

            let id = element.dataset.checkbox;
            
            if ({FSNOTES_PREVIEW}) {
                window.webkit.messageHandlers.checkbox.postMessage(id);
            }

            let input = document.createElement("input");
            input.type = "checkbox";
            input.dataset.checkbox = id;

            if (!element.hasAttribute('checked')) {
                input.defaultChecked = true;

                if (element.parentNode.nodeName == 'LI') {
                    element.parentNode.classList.add('strike');
                }
            }

            element.parentNode.replaceChild(input, element);

            input.addEventListener("click", function(event) {
                addCheckboxEvent(input);
            });
        };
        
        let addLocalAHrefEvent = () => {
            var aList = document.getElementsByTagName("A"),
                length = aList.length,
                i = 0;

            for (i; i < length; i++) {
                aList[i].addEventListener("click", function(event) {
                    var url = event.target.getAttribute("href");
                    window.webkit.messageHandlers.open.postMessage(url);
                });
            }
        };
        
        let loadCheckboxActions = () => {
            var inputs = document.querySelectorAll('input[type=checkbox]'),
                length = inputs.length,
                i = 0;
                
            for (i; i < length; i++) {
                if (inputs[i].parentNode.nodeName == "LI" && inputs[i].hasAttribute('checked')) {
                    inputs[i].parentNode.classList.add("strike");
                }

                inputs[i].disabled = false
                inputs[i].dataset.checkbox = i
                inputs[i].addEventListener("click", function(event) {
                    let element = event.target;
                    addCheckboxEvent(element);
                });
            }
        }
        
        let loadTOC = () => {
            const headings = document.querySelectorAll('#preview h1, #preview h2, #preview h3, #preview h4, #preview h5, #preview h6');
            const toc = document.getElementById('toc');
            const parts = [];
            let level = 0;
            headings.forEach(heading => {
                const nextLevel = Number(heading.tagName.slice(1));
                const anchor = encodeURIComponent(heading.textContent.replace(/ /g, '_'));
                if (!heading.id) heading.id = anchor;
                if (!toc) return;
                if (nextLevel > level) parts.push('<ul>'.repeat(nextLevel - level));
                if (nextLevel < level) parts.push('</ul>'.repeat(level - nextLevel));
                level = nextLevel;
                const link = document.createElement('a');
                link.href = '#' + heading.id;
                link.textContent = heading.textContent;
                parts.push('<li>' + link.outerHTML + '</li>');
            });
            if (toc) toc.innerHTML = parts.join('') + '</ul>'.repeat(level);
        };

        let mermaidLoader;
        let loadMemaid = async () => {
            const diagrams = document.querySelectorAll('.language-mermaid');
            if (!diagrams.length) return;
            if (!mermaidLoader) {
                mermaidLoader = new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = '{WEB_PATH}js/mermaid.min.js';
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
            }
            await mermaidLoader;
            mermaid.initialize({
                startOnLoad: false,
                theme: document.documentElement.classList.contains('darkmode') ? 'dark' : 'default',
                flowchart: { useMaxWidth: true, htmlLabels: true }
            });
            await mermaid.init(undefined, diagrams);
        };

        let loadAttachments = () => {
            var items = document.querySelectorAll('.attachment'),
                length = items.length,
                i = 0;

            for (i; i < length; i++) {
                items[i].addEventListener("click", function(event) {
                    let url = event.target.dataset.url;
                    window.webkit.messageHandlers.quicklook.postMessage(url);
                });
            }
        };

        let previewGeneration = 0;
        let rendering = Promise.resolve();
        const yieldToBrowser = () => new Promise(resolve => setTimeout(resolve, 0));

        async function initializePreview(generation) {
            loadTOC();
            loadCheckboxStyle();
            loadCheckboxActions();
            loadListStyle();
            loadAHover();
            loadCodeActions();
            loadAttachments();
            addLocalAHrefEvent();
            let started = performance.now();
            for (const code of document.querySelectorAll('pre > code:not(.language-mermaid)')) {
                if (generation !== previewGeneration) return false;
                hljs.highlightBlock(code);
                if (performance.now() - started > 8) {
                    await yieldToBrowser();
                    started = performance.now();
                }
            }
            try { await loadMemaid(); } catch (error) { console.error('Diagram rendering:', error); }
            if (generation !== previewGeneration) return false;
            if (window.MathJax && MathJax.startup) {
                await MathJax.startup.promise;
                if (generation !== previewGeneration) return false;
                await MathJax.typesetPromise([document.body]);
            }
            return generation === previewGeneration;
        }

        window.cancelPreview = generation => { previewGeneration = generation; };

        // Keep the document and loaded libraries alive when switching notes.
        window.renderPreview = (body, generation, x, y) => {
            previewGeneration = generation;
            rendering = rendering.catch(console.error).then(async () => {
                if (generation !== previewGeneration) return false;
                if (window.MathJax && MathJax.typesetClear) MathJax.typesetClear([document.body]);
                document.body.innerHTML = body;
                if (!await initializePreview(generation)) return false;
                // Complete even when WebKit suspends animation frames in a hidden window.
                await yieldToBrowser();
                if (generation !== previewGeneration) return false;
                window.scrollTo(x, y);
                return true;
            });
            return rendering;
        };

        window.onload = () => {
            // Exported pages already contain their body. Native previews receive it from Swift.
            if (document.body.children.length) {
                rendering = initializePreview(previewGeneration).catch(console.error);
            }
        };
    </script>
</head>

<body class="{FSNOTES_APPEARANCE} {FSNOTES_PLATFORM}" id="preview">
    {NOTE_BODY}
</body>

</html>
